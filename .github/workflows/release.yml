name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_release:
        description: "Publish a packaging-only .N+1 even though this declared state is released"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the golang-127 pin
        id: pins
        run: echo "golang=$(tr -d '[:space:]' < components/golang/version)" >> "$GITHUB_OUTPUT"

      # spec: shipyard .github/actions/install/action.yml `products` -- installs go127-cross at the pin and, first, what it requires
      #       (clang22, recaulk and sdk109 for the external darwin link), at /usr/local/mavergreen on Linux as on a Mac
      - name: Install mavericks-shipyard and the golang-127 cross toolchain
        uses: Mavergreen/shipyard/.github/actions/install@v1
        with:
          products: go127-cross@${{ steps.pins.outputs.golang }}

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Version + publish decision
        id: ver
        env:
          LOCAL_RELEASE: ${{ inputs.local_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mode=auto
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$LOCAL_RELEASE" = true ]; then mode=local; fi
          out="$(sh build/version.sh "$mode")"
          full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
          rel="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
          pub=no
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            pub="$rel"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$mode" = local ] || [ "$rel" = yes ]; then
              pub=yes
            else
              digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
              answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$full")"
              echo "release-needed: $answer"
              if [ "$answer" = PUBLISH ]; then
                pub=yes
                out="$(sh build/version.sh local)"
                full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
              fi
            fi
          fi
          printf '%s\n' "$full" > VERSION
          { echo "ver=$full"; echo "publish=$pub"; } >> "$GITHUB_OUTPUT"
          echo "version=$full publish=$pub"

      - name: Cross-build gh for 10.9 with the Linux-hosted go127-cross
        run: |
          shipyard-cmake --preset cross
          shipyard-cmake --build --preset cross

      - name: The compat guard, with every Objective-C send measured
        run: shipyard-ctest --preset cross

      - name: Locate the build
        run: echo "BUILD=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-cross" >> "$GITHUB_ENV"

      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - name: Hand gh, its man pages and completions to the package job, modes kept
        run: tar -cf "$RUNNER_TEMP/gobin.tar" -C "$BUILD" gobin

      - uses: actions/upload-artifact@v7
        with:
          name: gobin
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/gobin.tar

  package:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VER: ${{ needs.build.outputs.ver }}
      PUBLISH: ${{ needs.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "BUILD=$RUNNER_TEMP/gh" >> "$GITHUB_ENV"

      - name: Pin the version the build job resolved
        run: printf '%s\n' "$VER" > VERSION

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - uses: actions/download-artifact@v8
        with:
          name: gobin
          path: ${{ runner.temp }}

      - name: Unpack the built gh
        run: mkdir -p "$BUILD" && tar -xf "$RUNNER_TEMP/gobin.tar" -C "$BUILD"

      - name: Build the updater with clang22, x86_64 and arm64
        run: echo "UPDATER=$(sh build/build-updater.sh "$BUILD/updater")" >> "$GITHUB_ENV"

      - name: Check the pinned ingredients
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"

      - name: Package the .pkg
        run: |
          set -eu
          pkg="$(sh packaging/build-pkg.sh "$UPDATER" "$BUILD/gobin" "$VER" "$BUILD/dist")"
          [ -f "$pkg" ] || { echo "::error::build-pkg.sh did not print a pkg path: $pkg"; exit 1; }
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - name: The package yields exactly the built gh
        run: sh tests/package-test.sh "$PKG" "$BUILD/gobin/gh"

      - name: Release notes
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$VER" --version "$VER" \
            --product "GitHub CLI" --min-os 10.9.5 --out "$BUILD/dist/RELEASE_NOTES.md"

      - name: Record the declared state in the notes
        if: env.PUBLISH == 'yes'
        run: |
          set -eu
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file "$BUILD/dist/RELEASE_NOTES.md" --digest "$digest"

      - name: clang22's Mach-O readers, for the steps that read the pkg
        run: |
          set -eu
          CL="$(sh build/fetch-clang22.sh)"
          { echo "LIPO=$CL/bin/llvm-lipo"; echo "OTOOL=$CL/bin/llvm-otool"; echo "NM=$CL/bin/llvm-nm"; } >> "$GITHUB_ENV"

      - name: The standalone archive needs nothing else from Mavergreen
        run: sh "$SHIPYARD_SCRIPTS/check-standalone-archive.sh" "$BUILD/dist/gh-$VER-macos-x86_64.tar.gz"

      - name: Unsigned stand-in feeds (never published)
        if: env.PUBLISH != 'yes'
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" "$BUILD/dist" "$VER"

      - name: EdDSA-sign the .pkg + write gh.xml
        if: env.PUBLISH == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --product gh --feed-dir "$BUILD/dist" \
            --channel-title "GitHub CLI for Mavericks" --version "$VER" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")" \
            --notes-file "$BUILD/dist/RELEASE_NOTES.md" --pkg "$PKG" --min-os 10.9.5

      - name: Artifact conformance
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$BUILD/dist" "$VER" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: The feed is an upgrade on its line
        if: env.PUBLISH == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$BUILD/dist/gh.xml" --version "$VER"

      - name: The package job must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: gh
          path: ${{ env.BUILD }}/dist/*

  on-mavericks:
    needs: [package]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: gh
          path: dist
      - uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          copyback: false
          debug-on-error: true
          run: |
            pkg="$(ls dist/gh-*.pkg | head -n 1)"
            sudo installer -pkg "$pkg" -target /
            status=0; sh tests/gh-runs-test.sh /usr/local/mavergreen/bin/gh || status=$?
            [ "$status" -eq 0 ] || { echo "gh-runs-test.sh exited $status (77 is a skip, a failure here)"; exit 1; }
            status=0; sh tests/gh-installed-test.sh /usr/local/mavergreen/gh || status=$?
            [ "$status" -eq 0 ] || { echo "gh-installed-test.sh exited $status (77 is a skip, a failure here)"; exit 1; }

  scan:
    needs: [build, package]
    if: always() && (needs.build.outputs.publish == 'yes')
    permissions:
      actions: read
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: gh
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [build, package, scan, on-mavericks]
    if: needs.build.outputs.publish == 'yes'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.ver }}
      artifact: gh

  retry:
    needs: [build, publish]
    if: always() && needs.publish.result == 'failure'
    permissions:
      contents: read
      actions: write
    uses: Mavergreen/shipyard/.github/workflows/retry-release.yml@v1
    with:
      version: ${{ needs.build.outputs.ver }}

  required:
    name: required (release)
    if: always()
    needs: [build, package, on-mavericks, scan, publish, retry]
    runs-on: ubuntu-latest
    steps:
      - uses: Mavergreen/shipyard/.github/actions/required-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
