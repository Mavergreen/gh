name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_release:
        description: "Publish a packaging-only .N+1 even though this declared state is released"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Record the toolchain
        run: |
          clang --version
          xcodebuild -version

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Version + publish decision
        id: ver
        env:
          LOCAL_RELEASE: ${{ inputs.local_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mode=auto
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$LOCAL_RELEASE" = true ]; then mode=local; fi
          out="$(sh build/version.sh "$mode")"
          full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
          rel="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
          pub=no
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            pub="$rel"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$mode" = local ] || [ "$rel" = yes ]; then
              pub=yes
            else
              digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
              answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$full")"
              echo "release-needed: $answer"
              if [ "$answer" = PUBLISH ]; then
                pub=yes
                out="$(sh build/version.sh local)"
                full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
              fi
            fi
          fi
          printf '%s\n' "$full" > VERSION
          { echo "ver=$full"; echo "publish=$pub"; } >> "$GITHUB_OUTPUT"
          echo "version=$full publish=$pub"

      - name: Install patched Go (mavericks-golang cross toolchain)
        run: |
          set -eu
          . "$SHIPYARD_SCRIPTS/mavericks_fetch.sh"
          ver="$(cat components/golang/version)"
          gover="${ver%%-mavericks.*}"; rev="${ver#*-}"
          line="$(printf '%s' "$gover" | cut -d. -f1,2 | tr -d .)"
          base="https://github.com/Mavergreen/golang-${line}/releases/download/${ver}"
          sums="$RUNNER_TEMP/SHA256SUMS"
          shipyard_curl "$base/SHA256SUMS" "$sums"
          cand="golang-${gover}-cross-${rev}.pkg"
          hash="$(awk -v f="$cand" '$2==f {print $1}' "$sums")"
          [ -n "$hash" ] || { echo "::error::no $cand in golang-${line} ${ver} SHA256SUMS"; exit 1; }
          pkg="$RUNNER_TEMP/$cand"
          shipyard_fetch_verified "$base/$cand" "$hash" "$RUNNER_TEMP" "$cand"
          sudo installer -pkg "$pkg" -target /

      - name: Cross-build gh and the updater, then the compat guard
        run: |
          shipyard-cmake --preset cross -DGH_BUILD_UPDATER=ON
          shipyard-cmake --build --preset cross
          shipyard-ctest --preset cross

      - name: Locate the build
        run: echo "BUILD=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-cross" >> "$GITHUB_ENV"

      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      - name: Check the pinned ingredients
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"

      - name: Package the .pkg
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          pkg="$(sh packaging/build-pkg.sh "$BUILD/gh-updater.app" "$BUILD/gobin" "$VER" "$BUILD/dist")"
          [ -f "$pkg" ] || { echo "::error::build-pkg.sh did not print a pkg path: $pkg"; exit 1; }
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - name: The package yields exactly the built gh
        run: sh tests/package-test.sh "$PKG" "$BUILD/gobin/gh"

      - name: Release notes
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$VER" --version "$VER" \
            --product "GitHub CLI" --min-os 10.9.5 --out "$BUILD/dist/RELEASE_NOTES.md"

      - name: Record the declared state in the notes
        if: steps.ver.outputs.publish == 'yes'
        run: |
          set -eu
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file "$BUILD/dist/RELEASE_NOTES.md" --digest "$digest"

      - name: Unsigned stand-in feeds (never published)
        if: steps.ver.outputs.publish != 'yes'
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" "$BUILD/dist" "$VER"

      - name: EdDSA-sign the .pkg + write gh.xml
        if: steps.ver.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --product gh --feed-dir "$BUILD/dist" \
            --channel-title "GitHub CLI for Mavericks" --version "$VER" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")" \
            --notes-file "$BUILD/dist/RELEASE_NOTES.md" --pkg "$PKG" --min-os 10.9.5

      - name: Artifact conformance
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$BUILD/dist" "$VER" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: The feed is an upgrade on its line
        if: steps.ver.outputs.publish == 'yes'
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$BUILD/dist/gh.xml" --version "$VER"

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: gh
          path: ${{ env.BUILD }}/dist/*

  on-mavericks:
    needs: [build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: gh
          path: dist
      - uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          copyback: false
          debug-on-error: true
          run: |
            pkg="$(ls dist/gh-*.pkg | head -n 1)"
            sudo installer -pkg "$pkg" -target /
            status=0; sh tests/gh-runs-test.sh /usr/local/mavergreen/bin/gh || status=$?
            [ "$status" -eq 0 ] || { echo "gh-runs-test.sh exited $status (77 is a skip, a failure here)"; exit 1; }
            status=0; sh tests/gh-installed-test.sh /usr/local/mavergreen/gh || status=$?
            [ "$status" -eq 0 ] || { echo "gh-installed-test.sh exited $status (77 is a skip, a failure here)"; exit 1; }

  scan:
    needs: [build]
    if: always() && (needs.build.outputs.publish == 'yes')
    permissions:
      actions: read
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: gh
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [build, scan, on-mavericks]
    if: needs.build.outputs.publish == 'yes'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.ver }}
      artifact: gh
